[project]
name = "ai-buddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=22,<24",
  "pydantic>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "qa_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "C408", "DTZ003"]

