services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: aibuddy
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"]
    volumes: ["aibuddy-postgres:/var/lib/postgresql/data", "./backend/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U avito -d aibuddy"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://avito:avito@postgres:5432/aibuddy
      REDIS_URL: redis://redis:6379/0
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-hack-and-change-2026}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000"]
    command: ["sh", "-c", "python seed.py && gunicorn --bind 0.0.0.0:8000 --workers 2 'app:create_app()'"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 5s, timeout: 5s, retries: 20}
  frontend:
    build: ./frontend
    environment: {VITE_API_BASE: /api/v1}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, --spider, -q, http://127.0.0.1:3000], interval: 5s, timeout: 5s, retries: 20}
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["127.0.0.1:3001:3000"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: {postgres: {condition: service_healthy}}
volumes:
  aibuddy-postgres:

